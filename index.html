<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valentine’s Surprise ❤️</title>

<style>

    body {

        background: linear-gradient(135deg, #ffe6f0, #ffccf2);

        font-family: 'Arial', sans-serif;

        text-align: center;

        padding: 40px 20px;

        color: #333;

    }

    h1 {

        color: #ff3366;

        font-size: 2.5em;

        margin-bottom: 10px;

    }

    p {

        font-size: 1.2em;

    }

    input[type="password"] {

        padding: 12px;

        font-size: 18px;

        border-radius: 8px;

        border: 2px solid #ff6699;

        margin-top: 20px;

        width: 70%;

        max-width: 300px;

    }

    button {

        padding: 12px 25px;

        margin-left: 10px;

        font-size: 18px;

        background: #ff6699;

        color: white;

        border: none;

        border-radius: 8px;

        cursor: pointer;

        transition: transform 0.2s;

    }

    button:hover {

        background: #ff3366;

        transform: scale(1.1);

    }

    #message {

        margin-top: 30px;

        font-size: 1.4em;

        line-height: 1.5em;

    }

    .hearts {

        position: fixed;

        top: 0;

        left: 0;

        pointer-events: none;

        width: 100%;

        height: 100%;

        overflow: hidden;

        z-index: 0;

    }

    .hearts span {

        position: absolute;

        font-size: 24px;

        animation: floatUp 4s linear infinite;

    }

    @keyframes floatUp {

        0% { transform: translateY(100vh) scale(1); opacity: 0.8; }

        50% { transform: translateY(50vh) scale(1.2); opacity: 1; }

        100% { transform: translateY(-10vh) scale(1); opacity: 0; }

    }

</style>

</head>

<body>

    <h1>💌 A Kakha's Valentine Surprise 💌</h1>

    <p>Enter the secret password you know to unlock your message:</p>

    <input type="password" id="pass" placeholder="Your secret password">

    <button onclick="checkPass()">Unlock 💖</button>

    <p id="message"></p>



    <div class="hearts"></div>



<script>

// Floating hearts animation

const heartsContainer = document.querySelector('.hearts');

setInterval(() => {

    const heart = document.createElement('span');

    heart.innerText = '💖';

    heart.style.left = Math.random() * 100 + 'vw';

    heart.style.fontSize = (20 + Math.random() * 30) + 'px';

    heart.style.animationDuration = (3 + Math.random() * 3) + 's';

    heartsContainer.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);

}, 500);



// Password check

function checkPass() {

    const password = "aftermidnight";

    const input = document.getElementById("pass").value.trim();

    const message = document.getElementById("message");



    if(input === password) {

        message.innerHTML = "Amaka My love <br>Happy Valentine’s Day, my love! ❤️<br>The best chapter of my life started with you. Thank you for your smile, your heart, and your warmth. I love you more than words can say 💕";

    } else {

        message.innerHTML = "Hmm… that’s not it. Try again 😉";

    }

}

</script>

</body>


</html>
